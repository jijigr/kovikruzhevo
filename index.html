<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#eee0c5" />
  <meta name="description" content="КовиКружево — прокат вечерних и свадебных платьев." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23513a2b'/%3E%3Cpath d='M16 5c-6 0-9 5-7 10 1 3 3 4 3 7 0 2-2 3-3 3 3 2 6-1 7-4 1 3 4 6 7 4-1 0-3-1-3-3 0-3 2-4 3-7 2-5-1-10-7-10z' fill='%23f4ead8'/%3E%3C/svg%3E" />
  <title>КовиКружево — прокат платьев</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" aria-label="Открыть меню">☰</button>
      <a href="#home" class="brand" aria-label="КовиКружево — главная"><img src="assets/mark.png" alt="" /><span>КовиКружево</span></a>
      <button class="bag icon-btn" aria-label="Открыть корзину"><span>♧</span><b id="cartCount">0</b></button>
    </header>
    <main id="home">
      <section class="catalog-section" id="catalog">
        <div class="catalog-intro"><span>КовиКружево</span><p>Ваше платье уже ждёт своего особенного вечера</p></div>
        <div class="section-line"><h2>Каталог</h2><button class="filter-toggle" aria-expanded="false">Фильтры <span>⌄</span></button></div>
        <div class="filter-backdrop" id="filterBackdrop"></div>
        <div class="filters" id="filters" aria-hidden="true">
          <div class="filter-sheet-head"><span></span><h3>Фильтры</h3><button class="filters-close" aria-label="Закрыть фильтры">×</button></div>
          <div><label>Цвет</label><select id="color"><option value="all">Все цвета</option><option value="Айвори">Айвори</option><option value="Чёрный">Чёрный</option><option value="Шоколад">Шоколад</option><option value="Пудра">Пудра</option></select></div>
          <div><label>Размер</label><select id="size"><option value="all">Все размеры</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option></select></div>
          <div class="price-range"><label>Цена за 4 дня</label><p><output id="minPriceLabel">8 000 ₽</output> — <output id="maxPriceLabel">18 000 ₽</output></p><div class="range-wrap"><input id="minPrice" type="range" min="8000" max="18000" step="100" value="8000"><input id="maxPrice" type="range" min="8000" max="18000" step="100" value="18000"></div></div>
          <button id="clearFilters" class="clear">Сбросить</button>
        </div>
        <div id="products" class="product-grid"></div>
      </section>
    </main>
    <nav class="bottom-nav"><a class="active" href="#home">⌂<span>Главная</span></a><a href="#catalog">⌘<span>Каталог</span></a><button class="cart-open">♧<span>Корзина</span></button></nav>
  </div>
  <aside id="detail" class="sheet" aria-hidden="true"><div class="sheet-head"><button class="back">←</button><span class="brand-mini">КовиКружево</span><button class="cart-open">♧ <b id="detailCart">0</b></button></div><div id="detailBody"></div></aside>
  <aside id="cart" class="cart-drawer" aria-hidden="true"><div class="drawer-head"><h2>Корзина</h2><button class="close-cart">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Итого за 4 дня</span><strong id="cartTotal">0 ₽</strong><button class="checkout">Оставить заявку</button><small>Онлайн-запись на примерку будет подключена здесь позже.</small></div></aside>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
